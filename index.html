<!DOCTYPE html>
<html lang="pt-br" class="scroll-smooth">
<head>

    <title>Barbearia Monster</title>
    <meta name="description" content="Barbearia Monster Jundiaí - Estilo, precisão e o melhor atendimento. Agende seu horário!">

    <style>
        html { scroll-padding-top: 5.5rem; }

        .hover-card:hover { transform: scale(1.05); transition: 0.4s; }
        .glass { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); }

        .item-show { opacity: 1 !important; display: block !important; }
        .reveal { opacity: 0; transform: translateY(30px); transition: all 0.8s ease-out; }
        .reveal.active { opacity: 1; transform: translateY(0); }
        .nav-link.active { color: #eab308; }
        #mobile-menu { max-height: 0; overflow: hidden; transition: max-height 0.3s ease-out; }
        #mobile-menu.open { max-height: 12rem; }
    </style>
</head>
<body class="bg-[#0a0a0a] text-zinc-200 font-sans">

    <nav class="fixed w-full z-50 bg-[#0a0a0a]/95 backdrop-blur-md border-b border-white/5">

                    <span class="relative flex h-2 w-2">
                        <span id="dot-color" class="animate-ping absolute inline-flex h-full w-full rounded-full opacity-75"></span>

                    </span>
                    <span id="status-atendimento" class="text-[10px] font-bold uppercase tracking-widest text-zinc-300"></span>
                </div>

                <div class="hidden md:flex items-center gap-8 text-xs font-bold uppercase tracking-widest text-zinc-400">
                    <a href="#galeria" class="nav-link hover:text-yellow-500 transition-colors whitespace-nowrap">Galeria</a>
                    <a href="#depoimentos" class="nav-link hover:text-yellow-500 transition-colors whitespace-nowrap">Clientes</a>
                    <a href="#contato" class="nav-link hover:text-yellow-500 transition-colors whitespace-nowrap">Local</a>
                </div>

                <button id="menu-toggle" type="button" class="md:hidden flex items-center justify-center w-10 h-10 rounded-lg border border-zinc-800 text-zinc-300 hover:text-yellow-500 hover:border-yellow-500/50 transition-colors" aria-label="Abrir menu" aria-expanded="false">
                    <svg id="icon-menu" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
                    <svg id="icon-close" class="w-5 h-5 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
                </button>
            </div>

            <div id="mobile-menu" class="md:hidden">
                <div class="flex flex-col items-stretch pt-4 pb-2 border-t border-white/5 mt-4">
                    <a href="#galeria" class="nav-link-mobile py-3 px-2 text-sm font-bold uppercase tracking-widest text-zinc-400 hover:text-yellow-500 transition-colors text-center border-b border-white/5">Galeria</a>
                    <a href="#depoimentos" class="nav-link-mobile py-3 px-2 text-sm font-bold uppercase tracking-widest text-zinc-400 hover:text-yellow-500 transition-colors text-center border-b border-white/5">Clientes</a>

                </div>
            </div>
        </div>
    </nav>

    <div id="status-mobile" class="fixed top-[4.5rem] left-1/2 -translate-x-1/2 z-40 lg:hidden flex items-center gap-2 px-3 py-1 rounded-full border border-zinc-800 bg-zinc-900/90 backdrop-blur-sm">
        <span class="relative flex h-2 w-2">
            <span id="dot-color-mobile" class="animate-ping absolute inline-flex h-full w-full rounded-full opacity-75"></span>
            <span id="dot-fill-mobile" class="relative inline-flex rounded-full h-2 w-2"></span>
        </span>
        <span id="status-atendimento-mobile" class="text-[10px] font-bold uppercase tracking-widest text-zinc-300"></span>
    </div>

    <a href="https://wa.me/5511988903034" target="_blank" rel="noopener noreferrer" class="fixed bottom-6 right-6 z-50 bg-green-500 p-3.5 md:p-4 rounded-full shadow-lg hover:scale-110 transition-transform" aria-label="Agendar pelo WhatsApp">
        <svg class="w-7 h-7 md:w-8 md:h-8 text-white" fill="currentColor" viewBox="0 0 24 24"><path d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946.003-6.556 5.338-11.891 11.893-11.891 3.181.001 6.167 1.24 8.413 3.488 2.245 2.248 3.481 5.236 3.48 8.414-.003 6.557-5.338 11.892-11.893 11.892-1.99-.001-3.951-.5-5.688-1.448l-6.305 1.654z"/></svg>
    </a>

    <button id="btn-topo" type="button" onclick="window.scrollTo({top: 0, behavior: 'smooth'})" class="fixed bottom-24 right-6 z-50 bg-zinc-800 p-3 rounded-full hover:bg-yellow-500 transition-colors opacity-0 pointer-events-none" aria-label="Voltar ao topo">
        <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 15l7-7 7 7"/></svg>
    </button>

    <section class="relative min-h-screen flex flex-col items-center justify-center overflow-hidden px-4 pt-20 pb-12">
        <div class="absolute inset-0 bg-[url('https://i.postimg.cc/4NFsYq6D/Captura-de-tela-2026-07-16-221202.png')] bg-cover bg-center opacity-30 blur-sm"></div>
        <div class="relative z-10 text-center space-y-4 md:space-y-6">
            <img src="https://i.postimg.cc/wT29gnPt/75a9e72a-c093-40e4-8540-8fa75c47c632.png" alt="Logo Barbearia Monster" class="w-32 h-32 md:w-48 md:h-48 mx-auto rounded-full border border-yellow-500/30 p-1 shadow-[0_0_50px_rgba(234,179,8,0.15)]">
            <h1 class="text-4xl sm:text-5xl md:text-8xl font-black uppercase tracking-tighter gradient-text leading-tight">Barbearia Monster</h1>
            <p class="text-zinc-500 text-sm md:text-base uppercase tracking-[0.25em]">Jundiaí · SP</p>
        </div>
    </section>

    <section id="galeria" class="max-w-7xl mx-auto px-4 sm:px-6 py-16 md:py-24 reveal scroll-mt-24">
        <h2 class="text-2xl md:text-3xl font-bold text-center mb-10 md:mb-16 uppercase tracking-widest text-zinc-400">Nossos Trabalhos</h2>
        <div id="grid-cortes" class="grid grid-cols-2 md:grid-cols-4 gap-3 sm:gap-4 md:gap-6">
            <div class="overflow-hidden rounded-xl hover-card aspect-[3/4]"><img loading="lazy" src="https://i.postimg.cc/jdcRtB9q/1ab7b462-d0a6-4952-9b6e-8c178dda8a73.jpg" alt="Corte 1" onerror="this.src='https://via.placeholder.com/400'" class="w-full h-full object-cover border border-zinc-800"></div>
            <div class="overflow-hidden rounded-xl hover-card aspect-[3/4]"><img loading="lazy" src="https://i.postimg.cc/gksGm15L/60fa3c21-cc2e-43d0-978c-cc66744c151e.jpg" alt="Corte 2" onerror="this.src='https://via.placeholder.com/400'" class="w-full h-full object-cover border border-zinc-800"></div>
            <div class="overflow-hidden rounded-xl hover-card aspect-[3/4]"><img loading="lazy" src="https://i.postimg.cc/vHhGbCjg/65b4985d-d86d-4a0b-813e-9e81a04a2313.png" alt="Corte 3" onerror="this.src='https://via.placeholder.com/400'" class="w-full h-full object-cover border border-zinc-800"></div>
            <div class="overflow-hidden rounded-xl hover-card aspect-[3/4]"><img loading="lazy" src="https://i.postimg.cc/TY0TfBSK/7916587b-587b-484d-afb1-1da3cea046f6.png" alt="Corte 4" onerror="this.src='https://via.placeholder.com/400'" class="w-full h-full object-cover border border-zinc-800"></div>

            <div class="item-extra overflow-hidden rounded-xl hover-card aspect-[3/4]"><img loading="lazy" src="https://i.postimg.cc/QNQqxr3c/Captura-de-tela-2026-07-16-223000.png" alt="Corte 5" onerror="this.src='https://via.placeholder.com/400'" class="w-full h-full object-cover border border-zinc-800"></div>
            <div class="item-extra overflow-hidden rounded-xl hover-card aspect-[3/4]"><img loading="lazy" src="https://i.postimg.cc/nV41ctJG/Captura-de-tela-2026-07-16-223023.png" alt="Corte 6" onerror="this.src='https://via.placeholder.com/400'" class="w-full h-full object-cover border border-zinc-800"></div>
            <div class="item-extra overflow-hidden rounded-xl hover-card aspect-[3/4]"><img loading="lazy" src="https://i.postimg.cc/J7NQ4WLD/Captura-de-tela-2026-07-16-222910.png" alt="Corte 7" onerror="this.src='https://via.placeholder.com/400'" class="w-full h-full object-cover border border-zinc-800"></div>
            <div class="item-extra overflow-hidden rounded-xl hover-card aspect-[3/4]"><img loading="lazy" src="https://i.postimg.cc/zDCkX1rK/Captura-de-tela-2026-07-16-222932.png" alt="Corte 8" onerror="this.src='https://via.placeholder.com/400'" class="w-full h-full object-cover border border-zinc-800"></div>
        </div>
        <div class="text-center mt-8 md:mt-12">
            <button id="btn-mais" type="button" class="border border-yellow-500 text-yellow-500 px-8 md:px-10 py-3 rounded-full hover:bg-yellow-500 hover:text-black transition uppercase font-bold text-xs md:text-sm tracking-widest">Ver Mais Estilos</button>
        </div>
    </section>

    <section id="depoimentos" class="py-16 md:py-24 bg-[#0d0d0d] scroll-mt-24">
        <h2 class="text-2xl md:text-3xl font-bold text-center mb-10 md:mb-16 uppercase tracking-widest text-zinc-400 px-4">O que dizem nossos clientes</h2>
        <div class="max-w-5xl mx-auto px-4 sm:px-6 grid md:grid-cols-2 gap-4 md:gap-8">
            <div class="glass p-6 md:p-8 rounded-xl border border-zinc-800"><p class="text-zinc-500 italic mb-4">"Atendimento impecável!"</p><span class="text-yellow-500 font-bold">— João Silva</span></div>
            <div class="glass p-6 md:p-8 rounded-xl border border-zinc-800"><p class="text-zinc-500 italic mb-4">"O Combo Monster é sensacional!"</p><span class="text-yellow-500 font-bold">— Pedro Santos</span></div>
        </div>
    </section>

    <footer id="contato" class="border-t border-white/10 py-12 md:py-16 bg-[#0a0a0a] reveal scroll-mt-24">
        <div class="max-w-6xl mx-auto px-4 sm:px-6 grid md:grid-cols-2 gap-8 md:gap-12 items-center">
            <div class="space-y-4 text-center md:text-left">
                <h3 class="text-xl md:text-2xl font-bold text-yellow-500">Onde estamos 📍</h3>
                <p class="text-zinc-400">Rua Tocantins, Nº 35 - Retiro</p>
                <p class="text-zinc-400">Jundiaí - SP</p>
            </div>
            <div class="h-56 sm:h-64 w-full rounded-xl overflow-hidden border border-zinc-800 shadow-2xl">
                <iframe title="Localização Barbearia Monster" src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3659.208170889279!2d-46.88371382467332!3d-23.518606478839955!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x94cf26f8d3807205%3A0x6331a98074d92404!2sRua%20Tocantins%2C%2035%20-%20Retiro%2C%20Jundia%C3%AD%20-%20SP!5e0!3m2!1spt-BR!2sbr!4v1721179427670!5m2!1spt-BR!2sbr" width="100%" height="100%" style="border:0;" allowfullscreen="" loading="lazy"></iframe>
            </div>
        </div>
    </footer>

    <script>
        document.getElementById('btn-mais').addEventListener('click', function() {
            document.querySelectorAll('.item-extra').forEach(item => item.classList.add('item-show'));
            this.style.display = 'none';
        });

        function setStatus(text, colorPing, colorFill) {
            document.getElementById('status-atendimento').innerText = text;
            document.getElementById('dot-color').classList.add(colorPing);
            document.getElementById('dot-fill').classList.add(colorFill);
            document.getElementById('status-atendimento-mobile').innerText = text;
            document.getElementById('dot-color-mobile').classList.add(colorPing);
            document.getElementById('dot-fill-mobile').classList.add(colorFill);
        }

        const hora = new Date().getHours();
        const dia = new Date().getDay();

        if (dia >= 1 && dia <= 5 && hora >= 9 && hora < 19) {
            setStatus("Aberto Agora", "bg-green-400", "bg-green-500");
        } else {
            setStatus("Fechado Agora", "bg-red-400", "bg-red-500");
        }

        const menuToggle = document.getElementById('menu-toggle');
        const mobileMenu = document.getElementById('mobile-menu');
        const iconMenu = document.getElementById('icon-menu');
        const iconClose = document.getElementById('icon-close');

        function closeMobileMenu() {
            mobileMenu.classList.remove('open');
            menuToggle.setAttribute('aria-expanded', 'false');
            iconMenu.classList.remove('hidden');
            iconClose.classList.add('hidden');
        }

        menuToggle.addEventListener('click', () => {
            const isOpen = mobileMenu.classList.toggle('open');
            menuToggle.setAttribute('aria-expanded', isOpen);
            iconMenu.classList.toggle('hidden', isOpen);
            iconClose.classList.toggle('hidden', !isOpen);
        });

        document.querySelectorAll('.nav-link-mobile').forEach(link => {
            link.addEventListener('click', closeMobileMenu);
        });

        const btnTop = document.getElementById('btn-topo');
        const navLinks = document.querySelectorAll('.nav-link');
        const sections = ['galeria', 'depoimentos', 'contato'].map(id => document.getElementById(id));

        window.addEventListener('scroll', () => {
            document.querySelectorAll('.reveal').forEach(el => {
                if (el.getBoundingClientRect().top < window.innerHeight - 100) el.classList.add('active');
            });

            if (window.scrollY > 400) {
                btnTop.classList.remove('opacity-0', 'pointer-events-none');
            } else {
                btnTop.classList.add('opacity-0', 'pointer-events-none');
            }

            let current = '';
            sections.forEach(section => {
                if (section && section.getBoundingClientRect().top <= 120) current = section.id;
            });
            navLinks.forEach(link => {
                link.classList.toggle('active', link.getAttribute('href') === '#' + current);
            });
        });

        const btnWhats = document.querySelector('a[href*="wa.me"]');
        const horaAtual = new Date().getHours();
        const saudacao = horaAtual < 12 ? "Bom dia" : horaAtual < 18 ? "Boa tarde" : "Boa noite";
        btnWhats.href += `?text=${encodeURIComponent(saudacao + ", gostaria de agendar um horário na Monster!")}`;
    </script>
</body>
</html>
